<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DARK MUSIC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma tela para celular. Cabecalho, listas rolaveis, dock flutuante (mini player + abas) e player completo que sobe por cima. Preto puro, azul neon como unico acento. */
:root{
  --bg:#000; --s1:#05070c; --s2:#0a101b; --s3:#121b2b;
  --line:rgba(34,184,255,.16); --line2:rgba(34,184,255,.42);
  --neon:#22b8ff; --neon-hi:#8fdcff; --glow:rgba(34,184,255,.5);
  --fg:#e8f4ff; --mute:#8094aa; --dim:#506073; --danger:#ff6b81;
  --display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.4 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 50% -12%,rgba(34,184,255,.16),transparent 62%),linear-gradient(rgba(34,184,255,.035) 1px,transparent 1px) 0 0/100% 34px}
button,input,label{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--neon-hi);outline-offset:2px}
strong{font-weight:600}
.ic{width:24px;height:24px;fill:currentColor;flex:none}

#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px}

/* cabecalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{font:700 22px/1 var(--display);letter-spacing:.22em;display:flex;gap:.55em;align-items:baseline}
.brand .b2{color:var(--neon);text-shadow:0 0 14px var(--glow)}
.btn,.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);border-radius:10px;background:rgba(34,184,255,.06);font:600 12.5px var(--display);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn{min-height:46px;padding:0 20px}
.pill{min-height:40px;padding:0 14px}
.pill .ic{width:20px;height:20px}
.btn.primary{background:var(--neon);border-color:var(--neon);color:#00131c;box-shadow:0 0 22px var(--glow)}

/* views */
#views{flex:1;min-height:0;position:relative}
.view{height:100%;display:flex;flex-direction:column;min-height:0}
.view-head{display:flex;align-items:center;gap:8px;min-height:48px}
.view-head h2{margin:0;flex:1;min-width:0;font:700 20px var(--display);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--mute);font:500 11.5px var(--display);letter-spacing:.14em;text-transform:uppercase;padding:10px 2px 6px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:6px}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;background:var(--s2);border:1px solid var(--line);border-radius:12px;color:var(--mute)}
.search:focus-within{border-color:var(--line2);box-shadow:0 0 0 3px rgba(34,184,255,.1)}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--fg);font-size:16px}
.search input::placeholder{color:var(--dim)}
.search input::-webkit-search-cancel-button{display:none}

.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--mute);flex:none;position:relative}
.icon-btn.on{color:var(--neon);filter:drop-shadow(0 0 6px var(--glow))}
.icon-btn.fav-on{color:var(--neon)}
.badge1{position:absolute;right:6px;top:6px;font:700 9px var(--display);background:var(--neon);color:#00131c;border-radius:6px;padding:0 4px;line-height:13px}

/* linhas de faixas */
.row{display:flex;align-items:center;border-radius:12px}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:7px 4px 7px 6px;text-align:left;border-radius:12px;min-height:62px}
.row.cur{background:linear-gradient(90deg,rgba(34,184,255,.13),transparent 85%)}
.row.cur strong{color:var(--neon-hi)}
.thumb{position:relative;flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--s2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:12px;background:rgba(0,0,0,.6)}
.row.cur .eq{display:flex}
.eq b{width:3px;height:22px;background:var(--neon);box-shadow:0 0 6px var(--glow);transform-origin:bottom;transform:scaleY(.25)}
body.is-playing .row.cur .eq b{animation:eq 900ms ease-in-out infinite}
body.is-playing .row.cur .eq b:nth-child(2){animation-delay:-300ms}
body.is-playing .row.cur .eq b:nth-child(3){animation-delay:-600ms}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(.85)}}
.row-txt{min-width:0;flex:1;display:flex;flex-direction:column}
.row-txt strong,.row-txt small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-txt small{color:var(--mute);font-size:12.5px}
.row-dur{color:var(--mute);font:500 12.5px var(--display);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* playlists */
.pl-card{width:100%;display:flex;align-items:center;gap:14px;padding:8px 6px;min-height:68px;text-align:left;border-radius:12px;border-bottom:1px solid var(--line)}
.pl-tile{width:52px;height:52px;border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;overflow:hidden;background:var(--s2);color:var(--neon);flex:none}
.pl-tile img{width:100%;height:100%;object-fit:cover}
.pl-tile.fav{box-shadow:0 0 16px rgba(34,184,255,.25) inset}
.pl-actions{display:flex;gap:10px;padding:4px 0 8px}
.pl-actions .btn{flex:1}
.mute{color:var(--dim)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:36px 12px}
.empty-ic{width:76px;height:76px;border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;color:var(--neon);box-shadow:0 0 30px rgba(34,184,255,.2) inset,0 0 24px rgba(34,184,255,.12)}
.empty-ic .ic{width:36px;height:36px}
.empty h3{margin:6px 0 0;font:700 19px var(--display);letter-spacing:.05em}
.empty p{margin:0;color:var(--mute);max-width:34ch}
.empty .btn{width:100%;max-width:300px}

/* dock */
.dock{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.mini,.nav{background:rgba(7,11,19,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.7)}
.mini{position:relative;display:flex;align-items:center;gap:2px;padding:8px 6px 10px 8px;overflow:hidden}
.mini[hidden]{display:none}
.mini-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.mini-main img{width:44px;height:44px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
.mini .icon-btn{color:var(--fg)}
.mini-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--s3)}
.mini-prog b{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 10px var(--glow)}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;border-radius:12px;color:var(--mute);font:600 10.5px var(--display);letter-spacing:.14em;text-transform:uppercase}
.nav button[aria-current="page"]{color:var(--neon)}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--neon);box-shadow:0 0 10px var(--glow)}

/* player completo */
#player{position:fixed;inset:0;z-index:30;overflow-y:auto;background:radial-gradient(90% 50% at 50% 0%,rgba(34,184,255,.22),transparent 70%),var(--bg);transform:translateY(102%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-right,0px))}
#player.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.pl-inner{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px}
.p-top{display:flex;align-items:center;justify-content:space-between}
.eyebrow{font:600 11px var(--display);letter-spacing:.3em;color:var(--neon);text-shadow:0 0 10px var(--glow)}
.cover-frame{position:relative;width:min(100%,44vh,340px);aspect-ratio:1;margin:10px auto 6px}
.cover-frame img{width:100%;height:100%;object-fit:cover;display:block;border:1px solid var(--line2);box-shadow:0 0 50px rgba(34,184,255,.2)}
.cover-frame i{position:absolute;width:20px;height:20px;border:0 solid var(--neon);filter:drop-shadow(0 0 4px var(--glow))}
.cover-frame i:nth-of-type(1){top:-7px;left:-7px;border-top-width:2px;border-left-width:2px}
.cover-frame i:nth-of-type(2){top:-7px;right:-7px;border-top-width:2px;border-right-width:2px}
.cover-frame i:nth-of-type(3){bottom:-7px;left:-7px;border-bottom-width:2px;border-left-width:2px}
.cover-frame i:nth-of-type(4){bottom:-7px;right:-7px;border-bottom-width:2px;border-right-width:2px}
.p-meta{display:flex;align-items:center;gap:8px}
.p-meta>div{flex:1;min-width:0}
.p-meta h2{margin:0;font:700 22px/1.2 var(--display);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-meta p{margin:2px 0 0;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viz{width:100%;height:56px;display:block}
.seek{display:flex;flex-direction:column}
.times{display:flex;justify-content:space-between;color:var(--mute);font:500 12.5px var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:-2px}
.ctrls{display:flex;align-items:center;justify-content:space-between}
.ctrls .icon-btn{width:52px;height:52px}
.ctrls .icon-btn .ic{width:28px;height:28px}
.ctrls .big{width:76px;height:76px;background:var(--neon);color:#00131c;box-shadow:0 0 30px var(--glow)}
.ctrls .big .ic{width:36px;height:36px}
.vol{display:flex;align-items:center;gap:6px;margin-top:2px}
.vol .pct{width:34px;text-align:right;color:var(--mute);font:500 12px var(--display);font-variant-numeric:tabular-nums}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;margin:0;background:transparent;--p:0%;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--neon) var(--p),var(--s3) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--fg);border:2px solid var(--neon);margin-top:-7px;box-shadow:0 0 12px var(--glow)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--s3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--neon)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--fg);border:2px solid var(--neon)}

/* sheet + toast */
#sheetWrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#sheetWrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:100%;max-width:560px;max-height:82%;overflow-y:auto;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .2s;box-shadow:0 -10px 40px rgba(34,184,255,.14)}
#sheetWrap.on .backdrop{opacity:1}
#sheetWrap.on .sheet{transform:none}
.s-head{display:flex;align-items:center;gap:12px;padding:0 4px 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.s-head img{width:48px;height:48px;object-fit:cover;border:1px solid var(--line);border-radius:4px}
.s-title{font:700 17px var(--display);letter-spacing:.05em;margin:0 0 4px}
.s-sub{margin:0 0 12px;color:var(--mute)}
.s-item{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 6px;text-align:left;border-radius:10px;font-weight:500}
.s-item:active{background:var(--s3)}
.s-item .ic{color:var(--neon)}
.s-item.danger,.s-item.danger .ic{color:var(--danger)}
.s-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-actions{display:flex;gap:10px;margin-top:14px}
.s-actions .btn{flex:1}
.btn.danger{border-color:var(--danger);color:var(--danger);background:rgba(255,107,129,.08)}
.field{width:100%;height:48px;background:var(--s2);border:1px solid var(--line2);border-radius:10px;color:var(--fg);padding:0 14px;font-size:16px;outline:0}
.field:focus{box-shadow:0 0 0 3px rgba(34,184,255,.14)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:80;transform:translate(-50%,10px);max-width:min(92vw,420px);padding:10px 16px;background:var(--s3);border:1px solid var(--line2);border-radius:10px;font-size:13.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 0 24px rgba(34,184,255,.18)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
@media (max-height:640px){.cover-frame{width:min(100%,34vh,300px)}.ctrls .big{width:64px;height:64px}}
</style>

<div id="app">
  <header class="top">

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const fmt=s=>{ if(!isFinite(s)||s<0) return '0:00'; s=Math.floor(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`; };
const plural=(n,a,b)=>`${n} ${n===1?a:b}`;
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ---------- estado e armazenamento ---------- */
const LS='darkmusic.v1';
function readSaved(){ try{ return JSON.parse(localStorage.getItem(LS))||{}; }catch(e){ return {}; } }
const saved=readSaved();
const S={
  tracks:[], byId:new Map(), byKey:new Map(),
  queue:[], qi:-1, cur:null, playing:false, open:false,
  shuffle:!!saved.shuffle, repeat:[0,1,2].includes(saved.repeat)?saved.repeat:0,
  vol:Number.isFinite(saved.vol)?Math.min(100,Math.max(0,saved.vol)):80, muted:false,
  view:'lib', openPl:null, q:'', menu:null,
  pl:Array.isArray(saved.pl)?saved.pl.filter(p=>p&&p.id&&Array.isArray(p.keys)):[]
};
if(!S.pl.find(p=>p.id==='fav')) S.pl.unshift({id:'fav',name:'Favoritas',keys:[]});
else S.pl.sort((a,b)=>(b.id==='fav')-(a.id==='fav'));
function save(){ try{ localStorage.setItem(LS,JSON.stringify({pl:S.pl,vol:S.vol,shuffle:S.shuffle,repeat:S.repeat})); }catch(e){} }
let uid=0;

/* ---------- capas personalizadas (salvas no aparelho) ---------- */
let coverDBPromise;
function openCoverDB(){
  if(!('indexedDB' in window)) return Promise.reject(new Error('Armazenamento indisponível'));
  if(!coverDBPromise) coverDBPromise=new Promise((resolve,reject)=>{
    const req=indexedDB.open('darkmusic-covers',1);
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains('covers')) db.createObjectStore('covers',{keyPath:'key'}); };
    req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
  });
  return coverDBPromise;
}
async function getSavedCover(key){
  const db=await openCoverDB();
  return new Promise((resolve,reject)=>{ const tx=db.transaction('covers','readonly'), req=tx.objectStore('covers').get(key); req.onsuccess=()=>resolve(req.result?.blob||null); req.onerror=()=>reject(req.error); });
}
async function saveCover(key,blob){
  const db=await openCoverDB();
  return new Promise((resolve,reject)=>{ const tx=db.transaction('covers','readwrite'); tx.objectStore('covers').put({key,blob}); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error); });
}
async function loadCustomCover(t){
  try{
    const custom=await getSavedCover(t.key);
    const automatic=custom?null:await getSavedCover('auto:'+t.key);
    const blob=custom||(!t.realCover?automatic:null);
    if(blob){ if(t.customCoverUrl) URL.revokeObjectURL(t.customCoverUrl); t.customCoverUrl=URL.createObjectURL(blob); t.cover=t.customCoverUrl; t.realCover=true; }
  }catch(e){ console.warn('Não foi possível recuperar a capa salva',e); }
}
async function chooseTrackCover(file){
  const m=S.menu, t=m&&S.byId.get(m.id); if(!t||!file) return;
  if(!file.type.startsWith('image/')){ toast('Escolha uma imagem válida.'); return; }
  if(file.size>12*1024*1024){ toast('A imagem precisa ter até 12 MB.'); return; }
  try{
    await saveCover(t.key,file);
    const url=URL.createObjectURL(file);
    if(t.customCoverUrl) URL.revokeObjectURL(t.customCoverUrl);
    t.customCoverUrl=url; t.cover=url; t.realCover=true;
    if(S.cur===t.id) syncAll();
    renderAll(); closeSheet(); toast('Capa atualizada e salva!');
  }catch(e){ toast('Não consegui salvar essa capa. Tente outra imagem.'); }
}

/* ---------- capas geradas ---------- */
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function genCover(seed){
  const h=hash(seed), hue=185+(h%70), a=(h>>8)&255, cx=30+((h>>3)%40), cy=30+((h>>11)%40);
  let rings='';
  for(let i=1;i<=6;i++) rings+=`<circle cx="${cx}" cy="${cy}" r="${i*11}" fill="none" stroke="hsl(${hue} 100% 60%)" stroke-opacity="${(0.55-i*0.07).toFixed(2)}" stroke-width="${i%2?0.6:1.2}"/>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><radialGradient id="g" cx="${cx}%" cy="${cy}%" r="80%"><stop offset="0" stop-color="hsl(${hue} 100% 22%)"/><stop offset="1" stop-color="#02040a"/></radialGradient></defs><rect width="100" height="100" fill="url(#g)"/>${rings}<path d="M0 ${60+a%25}L100 ${40+(a>>2)%30}" stroke="hsl(${hue} 100% 70%)" stroke-opacity=".5" stroke-width=".6" fill="none"/><circle cx="${cx}" cy="${cy}" r="2.2" fill="hsl(${hue} 100% 75%)"/></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

/* ---------- leitura de tags ID3 (titulo, artista, capa de MP3) ---------- */
const u32=(b,i)=>b[i]*16777216+(b[i+1]<<16)+(b[i+2]<<8)+b[i+3];
const sync=(b,i)=>((b[i]&127)<<21)|((b[i+1]&127)<<14)|((b[i+2]&127)<<7)|(b[i+3]&127);
function decText(d){
  const enc=d[0]; let b=d.subarray(1), label='windows-1252';
  if(enc===1){ if(b[0]===0xFE&&b[1]===0xFF){label='utf-16be';b=b.subarray(2);} else if(b[0]===0xFF&&b[1]===0xFE){label='utf-16le';b=b.subarray(2);} else label='utf-16le'; }
  else if(enc===2) label='utf-16be';
  else if(enc===3) label='utf-8';
  try{ return new TextDecoder(label).decode(b).replace(/\u0000/g,' ').trim(); }catch(e){ return ''; }
}
function parseAPIC(d,v2){
  const enc=d[0]; let p=1;
  if(v2){ p=4; } else { while(p<d.length&&d[p]!==0) p++; p++; }
  p++;
  if(enc===1||enc===2){ while(p+1<d.length&&!(d[p]===0&&d[p+1]===0)) p+=2; p+=2; }
  else { while(p<d.length&&d[p]!==0) p++; p++; }
  const img=d.subarray(p); if(img.length<200) return null;
  let mime=null;
  if(img[0]===0xFF&&img[1]===0xD8) mime='image/jpeg';
  else if(img[0]===0x89&&img[1]===0x50) mime='image/png';
  else if(img[0]===0x47&&img[1]===0x49) mime='image/gif';
  else if(img[0]===0x52&&img[1]===0x49) mime='image/webp';
  if(!mime) return null;
  return URL.createObjectURL(new Blob([img.slice()],{type:mime}));
}
async function readID3(file){
  const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
  if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33) return {};
  const ver=head[3], size=sync(head,6), total=Math.min(size,10*1024*1024);
  const b=new Uint8Array(await file.slice(10,10+total).arrayBuffer());
  const out={}; let p=0;
  if(head[5]&0x40) p=ver===4?sync(b,0):u32(b,0)+4;
  const idLen=ver===2?3:4, hLen=ver===2?6:10;
  while(p+hLen<=b.length){
    if(b[p]===0) break;
    const id=String.fromCharCode(...b.subarray(p,p+idLen));
    const fs=ver===2?((b[p+3]<<16)|(b[p+4]<<8)|b[p+5]):ver===4?sync(b,p+4):u32(b,p+4);
    const s=p+hLen, e=s+fs;
    if(fs<=0||e>b.length) break;
    const d=b.subarray(s,e);
    if(id==='TIT2'||id==='TT2') out.title=decText(d);
    else if(id==='TPE1'||id==='TP1') out.artist=decText(d);
    else if(id==='TCON'||id==='TCO') out.genre=decText(d);
    else if((id==='APIC'||id==='PIC')&&!out.cover) out.cover=parseAPIC(d,ver===2);
    p=e;
  }
  return out;
}
function guessNames(name){
  const base=name.replace(/\.[^.]+$/,'').replace(/_+/g,' ').replace(/^\d+[\s.\-_)]+/,'').trim();
  const m=base.match(/^(.+?)\s+-\s+(.+)$/);
  return m?{artist:m[1].trim(),title:m[2].trim()}:{artist:'',title:base||name};
}
const isAudio=f=>/^audio\//.test(f.type)||/\.(mp3|m4a|aac|ogg|oga|opus|wav|flac|weba)$/i.test(f.name);
function getDur(url){
  return new Promise(res=>{
    const a=new Audio(); a.preload='metadata';
    const done=v=>{ clearTimeout(to); a.onloadedmetadata=a.onerror=null; a.removeAttribute('src'); res(v); };
    const to=setTimeout(()=>done(0),6000);
    a.onloadedmetadata=()=>done(isFinite(a.duration)?a.duration:0);
    a.onerror=()=>done(-1);
    a.src=url;
  });
}

/* ---------- faixas de demonstracao (sintetizadas, sem direitos autorais) ---------- */
function synthWav(spec){
  const sr=22050, dur=spec.dur, n=(sr*dur)|0, pcm=new Int16Array(n);
  const beat=60/spec.bpm, step=beat/4, f=s=>spec.root*Math.pow(2,s/12);
  for(let i=0;i<n;i++){
    const t=i/sr, si=Math.floor(t/step), st=t-si*step, k=si%16;
    const r=spec.prog[Math.floor(si/16)%spec.prog.length];
    const fr=f(r+spec.pat[k%spec.pat.length]+12);
    const env=Math.exp(-st*spec.decay)*(1-Math.exp(-st*400));
    let v=(Math.sin(6.2832*fr*t)+0.35*Math.sin(12.5664*fr*t)+(spec.saw?0.25*Math.sin(18.8496*fr*t):0))*env*0.28;
    const bt=t%beat, be=Math.exp(-bt*5)*(1-Math.exp(-bt*300));
    v+=Math.sin(6.2832*f(r-12)*t)*be*0.35;
    v+=(Math.sin(6.2832*f(r)*t)+Math.sin(6.2832*f(r+7)*t))*0.04;
    if(k%4===2) v+=(Math.random()*2-1)*Math.exp(-st*70)*0.05;
    const fade=Math.min(1,t/0.05,(dur-t)/1.5);
    pcm[i]=Math.max(-1,Math.min(1,v*fade))*32000;
  }
  const h=new DataView(new ArrayBuffer(44)), w=(o,s)=>{ for(let i=0;i<s.length;i++) h.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); h.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); h.setUint32(16,16,true); h.setUint16(20,1,true); h.setUint16(22,1,true);
  h.setUint32(24,sr,true); h.setUint32(28,sr*2,true); h.setUint16(32,2,true); h.setUint16(34,16,true); w(36,'data'); h.setUint32(40,n*2,true);
  return new Blob([h,pcm],{type:'audio/wav'});
}
const DEMOS=[
  {title:'Neon Drift',root:220,bpm:96,dur:30,prog:[0,-4,-2,3],pat:[0,7,12,7,0,7,14,12],decay:7},
  {title:'Circuit Rain',root:196,bpm:118,dur:28,prog:[0,-5,-3,-7],pat:[0,12,7,12,0,7,12,19],decay:10,saw:true},
  {title:'Void Signal',root:174.6,bpm:78,dur:32,prog:[0,3,-2,-4],pat:[0,7,14,7,12,7,0,7],decay:4}
];
async function addDemos(){
  toast('Gerando faixas de demonstração…',true);
  await new Promise(r=>setTimeout(r,40));
  let n=0;
  for(const d of DEMOS){
    const key='demo|'+d.title; if(S.byKey.has(key)) continue;
    const url=URL.createObjectURL(synthWav(d));
    addTrack({key,title:d.title,artist:'DARK MUSIC Labs',url,cover:genCover(key),dur:d.dur,name:d.title+'.wav'});
    n++; await new Promise(r=>setTimeout(r,0));
  }
  renderAll(); toast(n?`${plural(n,'faixa gerada','faixas geradas')}. Toque em uma para ouvir.`:'As faixas de demonstração já estão na biblioteca.');
}

/* ---------- biblioteca ---------- */
function addTrack(o){
  const t={id:'t'+(++uid),key:o.key,title:o.title,artist:o.artist||'Artista desconhecido',url:o.url,cover:o.cover||genCover(o.key),realCover:!!o.realCover,dur:o.dur||0,name:o.name||o.title,genre:o.genre||''};
  S.tracks.push(t); S.byId.set(t.id,t); S.byKey.set(t.key,t); return t;
}
async function addFiles(list){
  const files=[...list]; if(!files.length) return;
  let added=0,dup=0,bad=0; const newTracks=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(!isAudio(f)){ bad++; continue; }
    const key=f.name+'|'+f.size;
    toast(`Lendo ${i+1} de ${files.length}…`,true);
    let meta={}; try{ meta=await readID3(f); }catch(e){}
    if(S.byKey.has(key)){ const old=S.byKey.get(key); if(old&&!old.genre&&meta.genre) old.genre=meta.genre; dup++; continue; }
    const url=URL.createObjectURL(f), dur=await getDur(url);
    if(dur<0){ URL.revokeObjectURL(url); if(meta.cover) URL.revokeObjectURL(meta.cover); bad++; continue; }
    const g=guessNames(f.name);
    const track=addTrack({key,title:meta.title||g.title,artist:meta.artist||g.artist,url,cover:meta.cover,realCover:!!meta.cover,dur,name:f.name,genre:meta.genre||''});
    await loadCustomCover(track);
    newTracks.push(track);
    added++;
  }
  const organized=organizeTracks(false);
  renderAll();
  if(newTracks.some(t=>!t.realCover||!t.genre)) setTimeout(()=>autoCoverTracks(newTracks.filter(t=>!t.realCover||!t.genre),true),500);
  const parts=[]; if(added) parts.push(plural(added,'música adicionada','músicas adicionadas'));
  if(dup) parts.push(plural(dup,'já estava na biblioteca','já estavam na biblioteca'));
  if(bad) parts.push(plural(bad,'arquivo não pôde ser lido','arquivos não puderam ser lidos'));
  if(organized.moved) parts.push(`${organized.moved} organizada(s) por gênero`);
  toast(parts.join(' · ')||'Nada novo para adicionar.');
}
const AUTO_GENRES=[
  {id:'funk',name:'🔥 FUNK',terms:['funk','funk carioca','baile funk','funk paulista','mandela','putaria']},
  {id:'sertanejo',name:'🤠 SERTANEJO',terms:['sertanejo','sertanejo universitario','sertanejo raiz','moda de viola','country']},
  {id:'trap',name:'🎧 TRAP',terms:['trap','plug','drill']},
  {id:'rap',name:'🎤 RAP / HIP-HOP',terms:['rap','hip hop','hip-hop','boom bap']},
  {id:'pagode',name:'🥁 PAGODE / SAMBA',terms:['pagode','samba','samba-enredo']},
  {id:'forro',name:'🪗 FORRÓ',terms:['forro','piseiro','xote','baião','baiao']},
  {id:'gospel',name:'🙏 GOSPEL',terms:['gospel','louvor','adoração','adoracao','worship','christian']},
  {id:'eletronica',name:'⚡ ELETRÔNICA',terms:['eletronica','electronic','house','techno',' trance','edm','deep house','phonk']},
  {id:'pop',name:'🎶 POP',terms:['pop','k-pop','j-pop']},
  {id:'rock',name:'🎸 ROCK',terms:['rock','metal','punk','grunge','indie rock']},
  {id:'mpb',name:'🇧🇷 MPB / BRASILIDADES',terms:['mpb','bossa nova','musica brasileira','música brasileira']},
  {id:'reggae',name:'🌴 REGGAE',terms:['reggae','dancehall','ska']}
];
function classifyTrack(t){
  const genre=norm(t.genre||'');
  if(genre){
    const map=[
      ['funk',['funk','baile funk']],['sertanejo',['sertanejo']],['trap',['trap','drill']],
      ['rap',['rap','hip hop','hip-hop']],['pagode',['pagode','samba']],['forro',['forro','piseiro','xote','baiao']],
      ['gospel',['gospel','christian','worship','louvor']],['eletronica',['electronic','eletronica','dance','house','techno','edm','phonk']],
      ['pop',['pop']],['rock',['rock','metal','punk','grunge']],['mpb',['mpb','brazilian','bossa nova']],['reggae',['reggae','dancehall','ska']]
    ];
    for(const [id,terms] of map) if(terms.some(q=>genre.includes(norm(q)))) return AUTO_GENRES.find(g=>g.id===id)||null;
  }
  // Só usa nome/arquivo como pista quando contém um gênero explícito.
  const text=norm([t.name,t.title].filter(Boolean).join(' '));
  for(const g of AUTO_GENRES){
    const hits=g.terms.filter(term=>{ const q=norm(term).trim(); return q.length>3 && new RegExp('(^|[^a-z0-9])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(text); });
    if(hits.length) return g;
  }
  return null;
}
function organizeTracks(showToast=true){
  let moved=0, unknown=0;
  // Recalcula apenas as playlists automáticas; playlists pessoais e Favoritas ficam intactas.
  const autoIds=new Set([...AUTO_GENRES.map(g=>'auto-'+g.id),'auto-outros']);
  for(const pl of S.pl) if(autoIds.has(pl.id)) pl.keys=[];
  for(const t of S.tracks){
    const g=classifyTrack(t);
    const target=g?{id:'auto-'+g.id,name:g.name}:{id:'auto-outros',name:'📁 NÃO IDENTIFICADAS'};
    let pl=S.pl.find(p=>p.id===target.id);
    if(!pl){ pl={id:target.id,name:target.name,keys:[]}; S.pl.push(pl); }
    if(!pl.keys.includes(t.key)){ pl.keys.push(t.key); moved++; }
    if(!g) unknown++;
  }
  save();
  if(showToast) toast(`${moved} música(s) organizada(s). ${unknown} sem gênero reconhecido.`);
  return {moved,unknown};
}

// Busca capas na API pública do iTunes. A imagem encontrada é salva no aparelho
// para continuar aparecendo offline. Capas embutidas e escolhidas pelo usuário têm prioridade.
function similarity(a,b){
  a=norm(a).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  b=norm(b).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  if(!a||!b) return 0; if(a===b) return 1;
  const A=new Set(a.split(' ')), B=new Set(b.split(' '));
  const overlap=[...A].filter(x=>B.has(x)).length;
  return overlap/Math.max(A.size,B.size);
}
async function findOnlineCover(t){
  if(!navigator.onLine) return null;
  const title=String(t.title||'').trim(), artist=String(t.artist||'').trim();
  if(!title||title.length<2||/^(artista desconhecido|dark music labs)$/i.test(artist)) return null;
  const term=(title+' '+artist).trim();
  const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),9000);
  try{
    const url='https://itunes.apple.com/search?media=music&entity=song&limit=8&country=BR&term='+encodeURIComponent(term);
    const response=await fetch(url,{signal:controller.signal}); if(!response.ok) return null;
    const data=await response.json(); const items=Array.isArray(data.results)?data.results:[];
    let best=null,bestScore=0;
    for(const item of items){
      const ts=similarity(title,item.trackName||'');
      const as=artist?similarity(artist,item.artistName||''):0.5;
      const score=ts*0.72+as*0.28;
      if(ts>bestScore && score>bestScore){ best=item; bestScore=score; }
    }
    if(!best) return null;
    const titleScore=similarity(title,best.trackName||'');
    const artistScore=artist?similarity(artist,best.artistName||''):0.5;
    if(titleScore<(artist?0.72:0.9) || (artist && artistScore<0.25)) return null;
    return {url:(best.artworkUrl600||best.artworkUrl100||'').replace('100x100bb','600x600bb').replace('100x100','600x600'),genre:best.primaryGenreName||''};
  }catch(e){ return null; }
  finally{ clearTimeout(timeout); }
}
async function autoCoverOne(t){
  const found=await findOnlineCover(t); if(!found) return false;
  if(!t.genre && found.genre) t.genre=found.genre;
  if(t.realCover || !found.url) return false;
  try{
    const response=await fetch(found.url); if(!response.ok) return false;
    const blob=await response.blob(); if(!blob.type.startsWith('image/')||blob.size<1000||blob.size>8*1024*1024) return false;
    await saveCover('auto:'+t.key,blob);
    if(t.customCoverUrl) URL.revokeObjectURL(t.customCoverUrl);
    t.customCoverUrl=URL.createObjectURL(blob); t.cover=t.customCoverUrl; t.realCover=true;
    if(!t.genre && found.genre) t.genre=found.genre;
    return true;
  }catch(e){ return false; }
}
async function autoCoverTracks(list,showToast=true){
  const pending=list.filter(t=>!t.realCover||!t.genre); if(!pending.length) return {found:0,total:0};
  let found=0,done=0;
  if(showToast) toast('Procurando capas corretas na internet…',true);
  // Poucas buscas simultâneas para não sobrecarregar o celular nem a conexão.
  for(let i=0;i<pending.length;i+=3){
    const batch=pending.slice(i,i+3);
    const results=await Promise.all(batch.map(autoCoverOne));
    found+=results.filter(Boolean).length; done+=batch.length;
    if(showToast) toast(`Buscando capas: ${done}/${pending.length} · ${found} encontradas`,true);
  }
  organizeTracks(false); renderAll();
  if(showToast) toast(`${found} capa(s) encontrada(s). As não localizadas continuam com a capa padrão.`);
  return {found,total:pending.length};
}
async function autoOrganizeAndCovers(){
  const org=organizeTracks(false); renderAll();
  const missing=S.tracks.filter(t=>!t.realCover||!t.genre);
  const result=await autoCoverTracks(missing,false);
  renderAll();
  toast(`Playlists organizadas · ${result.found} capa(s) encontrada(s) · ${org.unknown} sem gênero identificado.`);
}

let actx=null, analyser=null;
function ensureGraph(){
  if(actx){ if(actx.state==='suspended') actx.resume().catch(()=>{}); return; }
  let src=null;
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    actx=new AC(); analyser=actx.createAnalyser(); analyser.fftSize=128; analyser.smoothingTimeConstant=.78;
    src=actx.createMediaElementSource(au); src.connect(analyser); analyser.connect(actx.destination);
    if(actx.state==='suspended') actx.resume().catch(()=>{});
  }catch(e){ analyser=null; try{ if(src) src.connect(actx.destination); }catch(_){} }
}
function curTrack(){ return S.cur?S.byId.get(S.cur):null; }
function queueFor(ctx){
  if(ctx&&ctx.startsWith('pl:')){ const pl=S.pl.find(p=>p.id===ctx.slice(3)); if(pl) return plTracks(pl).map(t=>t.id); }
  return visibleTracks().map(t=>t.id);

function playList(ids,startId){
  if(!ids.length) return;
  S.queue=ids; const i=Math.max(0,ids.indexOf(startId)); go(i);
}
function go(i){
  const t=S.byId.get(S.queue[i]); if(!t) return;
  S.qi=i; S.cur=t.id; ensureGraph();
  au.src=t.url; au.play().catch(onPlayErr);

}
function onPlayErr(e){ if(e&&(e.name==='AbortError')) return; toast('Não foi possível tocar este arquivo. O formato pode não ser compatível com o seu aparelho.'); }
function togglePlay(){
  if(!curTrack()){ const l=visibleTracks(); if(l.length) playList(l.map(t=>t.id),l[0].id); return; }
  ensureGraph();

}
function nextIndex(auto){
  const n=S.queue.length; if(!n) return -1;
  if(auto&&S.repeat===2) return S.qi;
  if(S.shuffle&&n>1){ let r; do{ r=Math.floor(Math.random()*n); }while(r===S.qi); return r; }
  let i=S.qi+1;
  if(i>=n){ if(S.repeat===1||!auto) i=0; else return -1; }
  return i;
}
function next(){ const i=nextIndex(false); if(i>=0) go(i); }
function prev(){
  if(au.currentTime>3||S.queue.length<2){ au.currentTime=0; return; }
  let i=S.qi-1; if(i<0) i=S.queue.length-1; go(i);
}

});

/* ---------- visualizador ---------- */
const vz=$('#viz'), vctx=vz.getContext('2d'), bars=new Float32Array(40);
let vdata=null, vraf=0;
function sizeViz(){ const r=window.devicePixelRatio||1; vz.width=Math.max(1,Math.round(vz.clientWidth*r)); vz.height=Math.max(1,Math.round(vz.clientHeight*r)); }
function drawViz(){
  vraf=0; if(!S.open) return;
  const W=vz.width,H=vz.height,N=bars.length,dpr=window.devicePixelRatio||1;
  vctx.clearRect(0,0,W,H);
  if(analyser&&S.playing){
    if(!vdata) vdata=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(vdata);
    const use=Math.floor(vdata.length*0.8);
    for(let i=0;i<N;i++){
      const a=Math.floor(i/N*use), b=Math.max(a+1,Math.floor((i+1)/N*use)); let m=0;
      for(let j=a;j<b;j++) m=Math.max(m,vdata[j]);
      bars[i]=Math.max(m/255,bars[i]*0.86);
    }
  } else { for(let i=0;i<N;i++) bars[i]*=0.88; }
  const gap=W/N, bw=Math.max(2,gap*0.56), g=vctx.createLinearGradient(0,H,0,0);
  g.addColorStop(0,'rgba(34,184,255,.45)'); g.addColorStop(1,'#8fdcff');
  vctx.fillStyle=g; vctx.shadowColor='rgba(34,184,255,.75)'; vctx.shadowBlur=8*dpr;
  let live=false;
  for(let i=0;i<N;i++){
    const h=Math.max(2*dpr,bars[i]*H); if(bars[i]>0.01) live=true;
    vctx.fillRect(i*gap+(gap-bw)/2,(H-h)/2,bw,h);
  }
  if(S.playing||live) vraf=requestAnimationFrame(drawViz);
}
function startViz(){ if(S.open&&!vraf&&!matchMedia('(prefers-reduced-motion: reduce)').matches) vraf=requestAnimationFrame(drawViz); }

    const isF=ctx==='pl:fav';
    rm=`<button class="s-item danger" data-act="m-rm-pl">${ic('trash')}<span>${isF?'Remover das favoritas':'Remover da playlist'}</span></button>`;
  } else rm=`<button class="s-item danger" data-act="m-rm-lib">${ic('trash')}<span>Remover da biblioteca</span></button>`;
  openSheet(`<div class="s-head"><img src="${t.cover}" alt=""><span class="row-txt"><strong>${esc(t.title)}</strong><small>${esc(t.artist)}</small></span></div>
    ${ctx==='player'?'':`<button class="s-item" data-act="m-play">${ic('play')}<span>Tocar agora</span></button>`}
    <button class="s-item" data-act="m-cover">${ic('image')}<span>Trocar capa da música</span></button>
    <button class="s-item" data-act="m-addpl">${ic('list')}<span>Adicionar à playlist</span></button>
    <button class="s-item" data-act="m-fav">${ic(fav?'heart-fill':'heart')}<span>${fav?'Tirar das favoritas':'Favoritar'}</span></button>
    ${rm}`);
}
function addToPlaylistSheet(id){
  const t=S.byId.get(id); if(!t) return;
  S.menu={id,ctx:S.menu&&S.menu.ctx};
  openSheet(`<h3 class="s-title">Adicionar à playlist</h3><p class="s-sub">${esc(t.title)}</p>
    ${S.pl.map(pl=>`<button class="s-item" data-act="toggle-pl" data-pl="${esc(pl.id)}">${ic(pl.id==='fav'?'heart-fill':'list')}<span class="grow">${esc(pl.name)}</span>${pl.keys.includes(t.key)?ic('check'):''}</button>`).join('')}
    <button class="s-item" data-act="new-pl-for" data-id="${t.id}">${ic('plus')}<span>Nova playlist</span></button>`);
}
function newPlaylistSheet(forId){
  openSheet(`<h3 class="s-title">Nova playlist</h3><p class="s-sub">Dê um nome para a sua playlist.</p>
    <input class="field" id="plName" maxlength="40" placeholder="Ex.: Treino, Foco, Noite" autocomplete="off" enterkeyhint="done" aria-label="Nome da playlist">
    <div class="s-actions"><button class="btn" data-act="sheet-close">Cancelar</button><button class="btn primary" data-act="pl-create" data-id="${forId||''}">Criar</button></div>`);
  setTimeout(()=>{ const i=$('#plName'); if(i) i.focus(); },260);
}
function createFromSheet(forId){
  const i=$('#plName'); if(!i||!i.value.trim()){ if(i) i.focus(); return; }
  const t=forId?S.byId.get(forId):null;
  const pl=createPlaylist(i.value,t?t.key:null);
  closeSheet();
  toast(t?`Música adicionada a “${pl.name}”.`:`Playlist “${pl.name}” criada.`);
}
$('#sheetBody').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='plName'){ e.preventDefault(); const b=$('#sheetBody [data-act="pl-create"]'); createFromSheet(b?b.dataset.id:''); }
});

/* ---------- toast ---------- */
let toastTimer=0;
function toast(msg,sticky){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastTimer);
  if(!sticky) toastTimer=setTimeout(()=>t.classList.remove('on'),3200);
}

/* ---------- eventos ---------- */
$('#file').addEventListener('change',async e=>{
  const inp=e.target; const files=[...inp.files];
  try{ await addFiles(files); }finally{ inp.value=''; }
});
const coverPicker=document.createElement('input');
coverPicker.type='file'; coverPicker.id='coverFile'; coverPicker.accept='image/*'; coverPicker.hidden=true;
coverPicker.addEventListener('change',async e=>{ const f=e.target.files&&e.target.files[0]; try{ await chooseTrackCover(f); }finally{ e.target.value=''; } });
document.body.appendChild(coverPicker);
$('#addLabel').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('#file').click(); } });
$('#q').addEventListener('input',e=>{ S.q=e.target.value; renderLib(); markRows(); });

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id, ctx=el.dataset.ctx;
  switch(a){
    case 'tab': setView(el.dataset.tab); break;
    case 'open-player': openPlayer(); break;
    case 'close-player': closePlayer(); break;
    case 'play-track': playList(queueFor(ctx),id); break;
    case 'menu-track': trackMenu(id,ctx); break;
    case 'menu-current': if(S.cur) trackMenu(S.cur,'player'); break;
    case 'toggle-play': togglePlay(); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'shuffle': S.shuffle=!S.shuffle; save(); syncModes(); toast(S.shuffle?'Modo aleatório ligado':'Modo aleatório desligado'); break;
    case 'repeat': S.repeat=(S.repeat+1)%3; save(); syncModes(); toast(['Repetição desligada','Repetindo todas','Repetindo esta música'][S.repeat]); break;
    case 'mute': S.muted=!S.muted; if(!S.muted&&S.vol===0) S.vol=50; syncVol(); save(); break;
    case 'fav-current': { const t=curTrack(); if(t){ const on=toggleMember('fav',t.key); toast(on?'Adicionada às favoritas':'Removida das favoritas'); } break; }
    case 'clear-q': S.q=''; $('#q').value=''; renderLib(); markRows(); $('#q').focus(); break;
    case 'demo': addDemos(); break;
    case 'new-pl': newPlaylistSheet(''); break;
    case 'auto-organize': autoOrganizeAndCovers(); break;
    case 'new-pl-for': newPlaylistSheet(id); break;
    case 'pl-create': createFromSheet(id); break;
    case 'open-pl': S.openPl=id; setView('pld'); break;
    case 'pl-back': setView('pl'); break;
    case 'pl-play': plStart(false); break;
    case 'pl-shuffle': plStart(true); syncModes(); break;
    case 'pl-delete': {
      const pl=S.pl.find(p=>p.id===S.openPl); if(!pl||pl.id==='fav') break;
      openSheet(`<h3 class="s-title">Excluir playlist</h3><p class="s-sub">“${esc(pl.name)}” será excluída. As músicas continuam na biblioteca.</p><div class="s-actions"><button class="btn" data-act="sheet-close">Cancelar</button><button class="btn danger" data-act="pl-delete-ok">Excluir</button></div>`);
      break;
    }
    case 'pl-delete-ok': S.pl=S.pl.filter(p=>p.id!==S.openPl||p.id==='fav'); save(); closeSheet(); setView('pl'); toast('Playlist excluída'); break;
    case 'm-play': if(S.menu){ const m=S.menu; closeSheet(); playList(queueFor(m.ctx),m.id); } break;
    case 'm-cover': if(S.menu){ $('#coverFile').click(); } break;
    case 'm-addpl': if(S.menu) addToPlaylistSheet(S.menu.id); break;
    case 'm-fav': if(S.menu){ const t=S.byId.get(S.menu.id); if(t){ const on=toggleMember('fav',t.key); toast(on?'Adicionada às favoritas':'Removida das favoritas'); } closeSheet(); } break;
    case 'toggle-pl': if(S.menu){ const t=S.byId.get(S.menu.id); if(t){ toggleMember(el.dataset.pl,t.key); addToPlaylistSheet(t.id); } } break;
    case 'm-rm-pl': if(S.menu&&S.menu.ctx){ const t=S.byId.get(S.menu.id); if(t){ const pid=S.menu.ctx.slice(3); const i=S.pl.find(p=>p.id===pid); if(i&&i.keys.includes(t.key)) toggleMember(pid,t.key); } closeSheet(); } break;
    case 'm-rm-lib': if(S.menu){ removeTrack(S.menu.id); closeSheet(); toast('Removida da biblioteca'); } break;
    case 'sheet-close': closeSheet(); break;
  }
});

/* ---------- inicio ---------- */
$('#vol').value=S.vol;
setView('lib');
renderAll();
})();
</script>

</body></html>
